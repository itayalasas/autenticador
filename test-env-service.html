<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Environment Service</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #3b82f6;
            margin-bottom: 20px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #2563eb;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #334155;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success {
            border-left: 4px solid #10b981;
        }
        .error {
            border-left: 4px solid #ef4444;
        }
        .loading {
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Environment Configuration Service</h1>

        <div>
            <button onclick="testLoadConfig()">Cargar Configuración</button>
            <button onclick="testGetVariable()">Test Variable Individual</button>
            <button onclick="testAllVariables()">Ver Todas las Variables</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        const API_URL = 'https://ffihaeatoundrjzgtpzk.supabase.co/functions/v1/get-env';
        const API_KEY = '4a63305a316f04fe2acf33b2b63135925bd3a0523c1fd453a42fbf1fc49e6240';

        function showResult(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = 'result ' + type;
        }

        async function testLoadConfig() {
            showResult('⏳ Cargando configuración...', 'loading');

            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'X-Access-Key': API_KEY,
                        'Content-Type': 'application/json',
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                window.__ENV__ = data.variables;

                showResult(
                    `✅ Configuración cargada exitosamente!\n\n` +
                    `Proyecto: ${data.project_name}\n` +
                    `Descripción: ${data.description}\n` +
                    `Variables cargadas: ${Object.keys(data.variables).length}\n` +
                    `Última actualización: ${data.updated_at}\n\n` +
                    `Variables:\n${JSON.stringify(data.variables, null, 2)}`,
                    'success'
                );
            } catch (error) {
                showResult(
                    `❌ Error al cargar configuración:\n\n${error.message}`,
                    'error'
                );
            }
        }

        function testGetVariable() {
            if (!window.__ENV__) {
                showResult('⚠️ Primero debes cargar la configuración', 'error');
                return;
            }

            const key = 'VITE_SUPABASE_URL';
            const value = window.__ENV__[key];

            showResult(
                `Variable: ${key}\nValor: ${value || '(no encontrada)'}`,
                value ? 'success' : 'error'
            );
        }

        function testAllVariables() {
            if (!window.__ENV__) {
                showResult('⚠️ Primero debes cargar la configuración', 'error');
                return;
            }

            const variables = Object.entries(window.__ENV__)
                .map(([key, value]) => `${key}: ${value}`)
                .join('\n');

            showResult(
                `📋 Variables de entorno cargadas:\n\n${variables}`,
                'success'
            );
        }

        showResult('👆 Haz clic en "Cargar Configuración" para comenzar');
    </script>
</body>
</html>
