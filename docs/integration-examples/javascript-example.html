<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de Integracion - AuthSystem</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; line-height: 1.5; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; margin: 16px 0; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; font-weight: 700; }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #e2e8f0; color: #0f172a; }
    code, pre { background: #0f172a; color: #e2e8f0; border-radius: 12px; }
    pre { padding: 16px; overflow-x: auto; }
    code { padding: 2px 6px; }
  </style>
</head>
<body>
  <h1>Ejemplo de integracion con AuthSystem</h1>

  <div class="card">
    <strong>Flujo actual:</strong>
    <p>La aplicacion redirige al usuario con <code>redirect_uri</code>. AuthSystem devuelve un <code>code</code> temporal y luego tu app lo intercambia por tokens con <code>auth-exchange-code</code>.</p>
  </div>

  <div class="actions">
    <button class="primary" onclick="login()">Iniciar sesion</button>
    <button class="secondary" onclick="register()">Registrarse</button>
    <button class="secondary" onclick="processCallback()">Procesar callback</button>
  </div>

  <div id="output" class="card">Esperando accion...</div>

  <script>
    const CONFIG = {
      APP_ID: 'app_mk2k3j4h5k6l',
      API_KEY: 'tu_api_key_publica',
      AUTH_BASE_URL: 'https://auth.tudominio.com',
      CALLBACK_URL: window.location.origin + '/auth/callback'
    };

    function login() {
      const url = `${CONFIG.AUTH_BASE_URL}/login?app_id=${CONFIG.APP_ID}&redirect_uri=${encodeURIComponent(CONFIG.CALLBACK_URL)}&api_key=${CONFIG.API_KEY}`;
      window.location.href = url;
    }

    function register() {
      const url = `${CONFIG.AUTH_BASE_URL}/register?app_id=${CONFIG.APP_ID}&redirect_uri=${encodeURIComponent(CONFIG.CALLBACK_URL)}&api_key=${CONFIG.API_KEY}`;
      window.location.href = url;
    }

    async function processCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const output = document.getElementById('output');

      if (!code || state !== 'authenticated') {
        output.textContent = 'No hay code valido en la URL. Usa el boton de login y vuelve a esta pagina con el callback.';
        return;
      }

      output.textContent = 'Intercambiando code por tokens...';

      const response = await fetch(`${CONFIG.AUTH_BASE_URL}/functions/v1/auth-exchange-code`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code,
          application_id: CONFIG.APP_ID
        })
      });

      const result = await response.json();
      if (!result.success) {
        output.textContent = `Error: ${result.error?.message || 'No se pudo intercambiar el code'}`;
        return;
      }

      const expiresIn = Number(result.data.expires_in || 86400);
      const authData = {
        access_token: result.data.access_token,
        refresh_token: result.data.refresh_token,
        token_type: result.data.token_type || 'Bearer',
        expires_at: new Date(Date.now() + expiresIn * 1000).toISOString(),
        user: result.data.user,
        application: result.data.application
      };

      localStorage.setItem('authData', JSON.stringify(authData));
      output.innerHTML = `
        <strong>Autenticacion exitosa</strong>
        <pre>${JSON.stringify(authData, null, 2)}</pre>
      `;
    }
  </script>
</body>
</html>
