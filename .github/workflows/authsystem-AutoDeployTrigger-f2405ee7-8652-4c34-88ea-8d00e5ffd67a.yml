name: Trigger auto deployment for authsystem

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev ]
    paths:
    - '**'
    - '.github/workflows/authsystem-AutoDeployTrigger-f2405ee7-8652-4c34-88ea-8d00e5ffd67a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AUTHSYSTEM_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AUTHSYSTEM_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AUTHSYSTEM_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.AUTHSYSTEM_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AUTHSYSTEM_REGISTRY_PASSWORD }}
          containerAppName: authsystem
          resourceGroup: contenedores
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


